<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Match AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="navbar">
        <div class="nav-left">
            <img src="assets/unext_logo.png" class="logo-img">
            <h2 class="site-title">College Match AI</h2>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <h1>College Match AI</h1>
        <p>Find colleges that match your background and goals.</p>

        <form id="studentForm">

            <!-- FINANCIAL SECTION -->
            <h3>💰 Financial Info</h3>

            <label>Family Income ($)</label>
            <input type="number" id="family_income" placeholder="50000" required>

            <label>Target Net Price ($)</label>
            <input type="number" id="target_net_price" placeholder="15000" required>

            <label>Max Work Hours / Week</label>
            <input type="number" id="max_work_hours" placeholder="15" required>


            <!-- PERSONAL BACKGROUND -->
            <h3>🧬 Personal Background</h3>

            <label>Ethnicity</label>
            <input type="text" id="self_ethnicity" placeholder="Asian, Black, Latino..." required>

            <label>Willing to Work a Job?</label>
            <select id="will_work_job">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>


            <!-- LOCATION -->
            <h3>📍 Location</h3>

            <label>Home Latitude</label>
            <input type="number" step="0.0001" id="home_lat" placeholder="34.05">

            <label>Home Longitude</label>
            <input type="number" step="0.0001" id="home_lon" placeholder="-118.25">


            <!-- ACADEMICS -->
            <h3>🎓 Academics</h3>

            <label>SAT Score</label>
            <input type="number" id="sat_score" placeholder="1200">

            <label>ACT Score</label>
            <input type="number" id="act_score" placeholder="Optional">

            <label>Intended Major</label>
            <input type="text" id="intended_major" placeholder="stem, business, arts..." required>


            <!-- COLLEGE TYPE PREFERENCES -->
            <h3>🏫 College Preferences</h3>

            <label>Preferred Sector</label>
            <select id="pref_sector">
                <option value="">No Preference</option>
                <option value="public">Public</option>
                <option value="private">Private</option>
            </select>

            <label>Preferred Size</label>
            <select id="pref_size">
                <option value="">No Preference</option>
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
            </select>


            <!-- IMPORTANCE SLIDERS -->
            <h3>📊 What Matters Most?</h3>

            <label>Affordability Importance</label>
            <input type="range" id="importance_afford" min="0" max="1" step="0.1" value="0.8">

            <label>Career Outcomes Importance</label>
            <input type="range" id="importance_outcomes" min="0" max="1" step="0.1" value="0.6">

            <label>Diversity Importance</label>
            <input type="range" id="importance_diversity" min="0" max="1" step="0.1" value="0.7">

            <label>Upward Mobility Importance</label>
            <input type="range" id="importance_mobility" min="0" max="1" step="0.1" value="0.8">

            <label>Location Importance</label>
            <input type="range" id="importance_location" min="0" max="1" step="0.1" value="0.5">


            <button type="submit" class="btn">Generate Matches</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
